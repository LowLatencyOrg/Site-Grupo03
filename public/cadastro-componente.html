<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Conta — lowlatency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="assets/icon/LowLatency-logo.png" />
  <link rel="stylesheet" href="css/auth.css" />
</head>

<body onload="buscarServidores()">

  <div class="cadastro-maquina">
    <div class="parte-cadastro"></div>
    <div class="parte-cadastro">
        <div class="card-cadastro">
        <a href="dashboard/dashboard.html" class="voltar-inicio">Voltar para a dashboard</a>

        <!-- Cabeçalho -->
        <div class="cabecalho-auth">
            <h1 class="titulo-auth">Cadastrar componente</h1>
        </div>

        <!-- Formulário de Cadastro -->
        <form class="formulario-cadastro">

            <div class="grupo-campo">
              <label class="rotulo-campo">Servidor</label>
              <input type="hidden" id="servidor_input" value="" />
              <div class="select-diferente">
                <div class="campo-empresa select" id="display_servidor">Selecione um servidor</div>
                <ul class="opcoes" id="lista_servidores">
                </ul>
              </div>
            </div>

            <div class="grupo-campo">
              <label class="rotulo-campo">Componente</label>
              <input type="hidden" id="componente_input" value="1" />
              <div class="select-diferente">
                <div class="campo-empresa select">CPU</div>
                <ul class="opcoes">
                  <li data-value="1">CPU</li>
                  <li data-value="2">RAM</li>
                  <li data-value="3">Disco</li>
                  <li data-value="4">Rede</li>
                </ul>
              </div>
            </div>

            <div class="grupo-campo">
              <label class="rotulo-campo">Tipo de medida</label>
              <input type="hidden" id="medida_input" value="" />
              <div class="select-diferente">
                <div class="campo-cnpj select" id="display_medida">Selecione o componente primeiro</div>
                <ul class="opcoes" id="lista_medidas">
                </ul>
              </div>
            </div>

            <div class="grupo-campo">
            <label class="rotulo-campo">Valor alerta</label>
            <input class="campo-nome" id="alerta_input" type="text"/>
            </div>

            <div class="grupo-campo">
            <label class="rotulo-campo">Valor crítico</label>
            <input class="campo-email" id="critico_input" type="email"/>
            </div>

            <button type="button" class="botao-cadastrar" onclick="cadastrar()">Concluir Cadastro</button>

        </form>

        <div class="rodape-auth">
            Ainda não cadastrou um servidor? <a href="cadastro-maquina.html">Cadastrar servidor</a>
        </div>

        <div id="cardErro" class="mensagem-alerta">
            <p id="mensagem_erro"></p>
        </div>
    </div>
    </div>
    <!-- Lado Esquerdo: Imagem de Telemetria -->
    <div class="parte-cadastro"></div>

    <!-- Lado Direito: Painel de Cadastro -->
    
  </div>
</body>
</html>

<script>
  let lista_servidores = []

  let medidasPorComponente = {
      "1": [
        { valor: "1", texto: "Uso em %" },
        { valor: "2", texto: "Frequência (GHz)" },
        { valor: "3", texto: "Temperatura (°C)" }
      ],
      "2": [
        { valor: "1", texto: "Uso em %" },
        { valor: "4", texto: "Quantidade Livre (GB)" },
        { valor: "5", texto: "Uso em % da Swap" }
      ],
      "3": [
        { valor: "1", texto: "Uso em %" },
        { valor: "6", texto: "Espaço Livre (GB)" },
        { valor: "7", texto: "Leitura e Gravação (MB/s)" }
      ],
      "4": [
        { valor: "8", texto: "Pacotes Perdidos (%)" },
        { valor: "9", texto: "Latência (ms)" },
        { valor: "10", texto: "Banda Utilizada (Mbps)" }
      ]
    };

  function buscarServidores() {
    //var idEmpresa = sessionStorage.getItem("ID_EMPRESA")
    var idEmpresa = 1
    fetch(`/maquinas/buscarServidores/${idEmpresa}`)
      .then(function (resposta) {
        if (resposta.ok) {
          resposta.json().then(function (respostaEmp) {
            console.log(`Dados recebidos: ${JSON.stringify(respostaEmp)}`);
            preencherServidores(respostaEmp)
          });
        }else {
          console.error('Nenhum dado encontrado ou erro na API');
        }
      }).catch(function (error) {
          console.error(`Erro na obtenção dos servidores: ${error.message}`);
        });
        
  }    

  function preencherServidores(listaServidores) {
    let listaHtml = document.getElementById('lista_servidores') 
    let displayHtml = document.getElementById('display_servidor')
    let hiddenInput = document.getElementById('servidor_input')
    listaHtml.innerHTML = ''

    if (!listaServidores || listaServidores.length == 0) {
      displayHtml.textContent = "Nenhum servidor encontrado"
      hiddenInput.value = ''
      return
    }

    listaServidores.forEach(servidor => {
      let li =document.createElement('li')
      li.setAttribute('data-value', servidor.id_servidor)
      li.textContent = servidor.hostname
      listaHtml.appendChild(li)
    })
  }

  function preencherMedidas(selecionado) {
    let listaHtml = document.getElementById('lista_medidas') 
    let displayHtml = document.getElementById('display_medida')
    let hiddenInput = document.getElementById('medida_input')
    listaHtml.innerHTML = ''
    hiddenInput.value = ''

    let medidas = medidasPorComponente[selecionado]
    if (!medidas || medidas.length === 0) {
      displayHtml.textContent = 'Selecione o componente primeiro';
      return;
    }
    displayHtml.textContent = 'Selecione a medida';

    medidas.forEach(medida => {
      let li = document.createElement('li');
      li.setAttribute('data-value', medida.valor);
      li.textContent = medida.texto;
      
      listaHtml.appendChild(li);
    });

  }

  function cadastrar() {
    var idServidorVar = servidor_input.value
    var idComponenteVar = componente_input.value
    //var idEmpresaVar = sessionStorage.getItem("ID_EMPRESA")
    var idEmpresaVar = 1
    var idMetricaVar = medida_input.value;
    var valorLimite1Var = alerta_input.value;
    var valorLimite2Var = critico_input.value;
    
    if (idServidorVar == "" || idComponenteVar == "" || idMetricaVar == "" || valorLimite1Var == "" || valorLimite2Var == "") {
      cardErro.style.display = "block";
      cardErro.className = "mensagem-alerta erro";
      mensagem_erro.innerHTML = "Preencha todos os campos em branco para prosseguir!";
      setTimeout(sumirMensagem, 5000);
      return false;
    }

    fetch("/componentes/cadastrar", {
          method: "POST",
          headers: {
              "Content-Type": "application/json",
          },
          body: JSON.stringify({
              idServidorServer: idServidorVar,
              idComponenteServer: idComponenteVar,
              idEmpresaServer: idEmpresaVar,
              idMetricaServer: idMetricaVar,
              valorLimite1Server: valorLimite1Var,
              valorLimite2Server: valorLimite2Var
          })
      })
          .then(function (resposta) {
              console.log("Resposta: ", resposta);

              if (resposta.ok) {
                  cardErro.style.display = "block";

                  mensagem_erro.innerHTML =
                      "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

                  setTimeout(() => {
                      window.location = "login.html";
                  }, "2000");
              } else {
                  throw "Houve um erro ao tentar realizar o cadastro!";
              }
          })
          .catch(function (resposta) {
              console.log(`#ERRO: ${resposta}`);
          });

    return false;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const selects = document.querySelectorAll('.select-diferente');
    selects.forEach(sele => {
      const select = sele.querySelector('.select');
      const listaOpcoes = sele.querySelector('.opcoes');
      const hiddenInput = sele.parentElement.querySelector('input[type="hidden"]');

      select.addEventListener('click', function() {        
        document.querySelectorAll('.opcoes').forEach(list => {
          if (list !== listaOpcoes) list.classList.remove('open');
        });
        document.querySelectorAll('.select').forEach(box => {
          if (box !== select) box.classList.remove('open');
        });
        listaOpcoes.classList.toggle('open');
        select.classList.toggle('open');
      });

      listaOpcoes.addEventListener('click', function(e) {
        let liClicada = e.target.closest('li');
        
        if (liClicada) {
          select.textContent = liClicada.textContent;
          
          if (hiddenInput) {
            hiddenInput.value = liClicada.getAttribute('data-value');
            if (hiddenInput.id === 'componente_input') {
              preencherMedidas(hiddenInput.value);
            }
          }

          listaOpcoes.classList.remove('open');
          select.classList.remove('open');
        }
      });
    });

      document.addEventListener('click', function(e) {
        if (!e.target.closest('.select-diferente')) {
          document.querySelectorAll('.opcoes').forEach(list => list.classList.remove('open'));
          document.querySelectorAll('.select').forEach(box => box.classList.remove('open'));
        }
      });

      let componenteInicial = document.getElementById('componente_input').value;
      if (componenteInicial) {
        preencherMedidas(componenteInicial);
      }
  });

  function trocaTela(){
    window.location = "manutencao.html"
  }
  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
