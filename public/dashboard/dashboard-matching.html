<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LowLatency | Dashboard Matching Engine</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/dashboards.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>

<body class="tela">

    <header class="navbar">
        <div class="conteiner navbar-conteudo">

            <a href="../index.html" class="logo">
                <img src="../assets/icon/logobranca.png" class="logo-imagem" alt="">
                <span>Low<span class="logo-destaque">Latency</span></span>
            </a>

            <nav class="botoes-dashboards" aria-label="Dashboards individuais">
                <a href="dash-kajio.html" class="botao-nav">Diagnóstico</a>
                <a href="" class="botao-nav">Individual 2</a>
                <a href="" class="botao-nav">Individual 3</a>
                <a href="" class="botao-nav">Individual 4</a>
                <a href="" class="botao-nav">Individual 5</a>
            </nav> 

            <div class="botoes-nav">
                <a href="dashboard-principal.html" class="botao-nav">
                    Voltar para Dashboard Principal
                    <span aria-hidden="true">↗</span>
                </a>
            </div>

        </div>
    </header>

    <main class="dashboard">
        <div class="pagina-topo">
            <h1>Matching Engine</h1>
            <div class="atualizacao">
                <i aria-hidden="true"></i>
                <span>Atualizado em <time id="ultimaAtualizacao">--</time></span>
            </div>
        </div>

        <section class="kpis-detalhes" aria-label="Resumo">
            <div class="kpi">
                <span>Uso da CPU</span>
                <b id="kpiCPU"></b>
            </div>
            <div class="kpi">
                <span>Uso da RAM</span>
                <b id="kpiRAM"></b>
            </div>
            <div class="kpi">
                <span>Uso da SWAP</span>
                <b id="kpiSWAP"></b>
            </div>
            <div class="kpi">
                <span>Uso do disco</span>
                <b id="kpiDisco"></b>
            </div>
        </section>

        <div class="conteudo">

            <section class="kpis" aria-label="Rede e interrupções">

                <div class="kpi-geral">
                    <div class="servidor-cabecalho">
                        <h3>Tráfego de rede</h3>
                    </div>

                    <div class="servidor-info">
                        <span>Dados recebidos</span>
                        <b id="redeRecebida"></b>
                    </div>

                    <div class="motivo" id="redeEnviada"></div>
                </div>

                <div class="kpi-geral">
                    <div class="servidor-cabecalho">
                        <h3>Softirq</h3>
                    </div>

                    <div class="servidor-info">
                        <span>Interrupções de software</span>
                        <b id="softirq"></b>
                    </div>

                    <div class="barra">
                        <div class="progresso" id="barraSoftirq" style="width: 0%;"></div>
                    </div>
                </div>

            </section>

            <section class="area-grafico">
                <div class="cabecalho-grafico">
                    <div>
                        <h2 id="tituloGrafico"></h2>
                        <p id="subtituloGrafico"></p>
                        <div class="legenda" id="legendaGrafico"></div>
                    </div>

                    <div class="periodos" role="group" aria-label="Métrica">
                        <button data-p="cpu" aria-pressed="true">CPU</button>
                        <button data-p="memoria" aria-pressed="false">Memória</button>
                        <button data-p="rede" aria-pressed="false">Rede</button>
                    </div>
                </div>

                <div class="grafico">
                    <canvas id="graficoMatching" role="img"
                        aria-label="Gráfico da métrica escolhida nos última hora"></canvas>
                </div>
            </section>

        </div>
    </main>

    <script>



let parametros = new URLSearchParams(window.location.search);
let idServidor = parametros.get('idServidor') || 1;
let idUsuario = sessionStorage.ID_USUARIO;

let metricaAtual = 'cpu';
let unidade = '%';


let atual = {};
let nivelAtual = {};

let nomesNivel = ['Sem status', 'Normal', 'Atenção', 'Crítico'];



function situacao(componente) {

    let n = nivelAtual[componente];

    if (n == undefined || n == null) {
        return 'sem status';
    }

    return nomesNivel[n].toLowerCase();

}

// Mostra o número ou "--" quando ainda não tem leitura
function formatar(valor, sufixo) {

    if (valor == undefined || valor == null) {
        return '--';
    }

    return Number(valor).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + sufixo;

}


function nomeServidor(hostname) {

    let partes = hostname.split('-');

    for (let i = 0; i < partes.length; i++) {
        partes[i] = partes[i].charAt(0).toUpperCase() + partes[i].slice(1);
    }

    return partes.join(' ');

}


// fetch das KPIS

function buscarKPIs() {

    fetch(`/dashboardMatching/kpis/${idServidor}/${idUsuario}`)
        .then(function (resposta) {

            if (resposta.status == 200) {
                return resposta.json();
            }

            return null;

        })
        .then(function (dados) {

            if (dados == null) {
                console.log('Nenhuma leitura encontrada para este servidor.');
                return;
            }

            atual = {
                cpu: dados.cpuUso,
                ram: dados.ramUso,
                swap: dados.swapUso,
                disco: dados.discoUso,
                softirq: dados.softirq,
                redeRecebida: dados.redeRecebidos,
                redeEnviada: dados.redeEnviados
            };

            nivelAtual = {
                cpu: dados.cpuAlerta,
                ram: dados.ramAlerta,
                swap: dados.swapAlerta,
                disco: dados.discoAlerta,
                softirq: dados.softirqAlerta
            };

            document.querySelector('.pagina-topo h1').textContent = nomeServidor(dados.hostname);
            document.getElementById('ultimaAtualizacao').textContent = dados.atualizadoEm + ' (BRT)';

            document.getElementById('kpiCPU').textContent = formatar(atual.cpu, '%');
            document.getElementById('kpiRAM').textContent = formatar(atual.ram, '%');
            document.getElementById('kpiSWAP').textContent = formatar(atual.swap, '%');
            document.getElementById('kpiDisco').textContent = formatar(atual.disco, '%');

            document.getElementById('softirq').textContent = formatar(atual.softirq, '%');
            document.getElementById('barraSoftirq').style.width = Math.min(100, Number(atual.softirq) || 0) + '%';

            document.getElementById('redeRecebida').textContent = formatar(atual.redeRecebida, ' KB/s');
            document.getElementById('redeEnviada').textContent = 'Dados enviados: ' + formatar(atual.redeEnviada, ' KB/s');

            atualizarSubtitulo();

        })
        .catch(function (erro) {
            console.log('Erro ao buscar os KPIs: ', erro);
        });

}


// Monta as linhas do gráfico

function criarLinha(nome, valores, cor) {

    return {
        label: nome,
        data: valores,
        borderColor: cor,
        backgroundColor: cor,
        borderWidth: 2,
        tension: 0.3,
        pointRadius: 2,
        pointHoverRadius: 4
    };

}


// Configuração do gráfico

Chart.defaults.font.family = "'Inter', sans-serif";
Chart.defaults.color = '#94a3b8';
Chart.defaults.animation = false;

let grafico = new Chart(document.getElementById('graficoMatching'), {

    type: 'line',

    data: {
        labels: [],
        datasets: []
    },

    options: {
        maintainAspectRatio: false,

        interaction: {
            mode: 'index',
            intersect: false
        },

        plugins: {
            legend: {
                display: false
            },

            tooltip: {
                backgroundColor: '#0b111e',
                borderColor: '#394862',
                borderWidth: 1,
                padding: 10,

                callbacks: {
                    label: function (c) {
                        return ' ' + c.dataset.label + ': ' + c.parsed.y.toLocaleString('pt-BR') + unidade;
                    }
                }
            }
        },

        scales: {
            x: {
                grid: {
                    display: false
                },
                border: {
                    display: false
                }
            },

            y: {
                min: 0,
                max: 100,
                border: {
                    display: false
                },
                grid: {
                    color: 'rgba(148,163,184,.08)'
                },
                ticks: {
                    stepSize: 25,
                    callback: function (v) {
                        return v.toLocaleString('pt-BR') + unidade;
                    }
                }
            }
        }
    }

});


// Texto embaixo do título do gráfico 

function atualizarSubtitulo() {

    let texto;

    if (metricaAtual == 'cpu') {

        texto = 'CPU em ' + formatar(atual.cpu, '%') + ' (' + situacao('cpu') + ') · softirq em ' +
                formatar(atual.softirq, '%') + ' (' + situacao('softirq') + ')';

    } else if (metricaAtual == 'memoria') {

        texto = 'RAM em ' + formatar(atual.ram, '%') + ' (' + situacao('ram') + ') · SWAP em ' +
                formatar(atual.swap, '%') + ' (' + situacao('swap') + ')';

    } else {

        texto = 'Última leitura: ' + formatar(atual.redeRecebida, ' KB/s') + ' recebidos e ' +
                formatar(atual.redeEnviada, ' KB/s') + ' enviados';

    }

    document.getElementById('subtituloGrafico').textContent = texto;

}


function atualizarGrafico(metrica) {

    metricaAtual = metrica;

    let titulo;
    let nomes;
    let max;
    let passo;

    if (metrica == 'cpu') {

        titulo = 'Uso de CPU e softirq';
        nomes = ['CPU', 'Softirq'];
        unidade = '%';
        max = 100;
        passo = 25;

    } else if (metrica == 'memoria') {

        titulo = 'Memória RAM e SWAP';
        nomes = ['RAM', 'SWAP'];
        unidade = '%';
        max = 100;
        passo = 25;

    } else {

        titulo = 'Tráfego de rede';
        nomes = ['Dados recebidos', 'Dados enviados'];
        unidade = ' KB/s';
        max = undefined;   
        passo = undefined;

    }

    document.getElementById('tituloGrafico').textContent = titulo;
    atualizarSubtitulo();

    // Atualiza o botão selecionado
    let botoes = document.querySelectorAll('.periodos button');

    for (let i = 0; i < botoes.length; i++) {

        if (botoes[i].getAttribute('data-p') == metrica) {
            botoes[i].setAttribute('aria-pressed', 'true');
        } else {
            botoes[i].setAttribute('aria-pressed', 'false');
        }

    }

    // fetch dos gráficos 
 
fetch(`/dashboardMatching/historico/${idServidor}/${idUsuario}/${metrica}`)
        .then(function (resposta) {

            if (resposta.status == 200) {
                return resposta.json();
            }

            return [];

        })
        .then(function (dados) {

            if (metrica != metricaAtual) {
                return;
            }

            let rotulos = [];
            let serie1 = [];
            let serie2 = [];

            for (let i = 0; i < dados.length; i++) {

                rotulos.push(dados[i].horario);
                serie1.push(dados[i].serie1 == null ? null : Number(dados[i].serie1));
                serie2.push(dados[i].serie2 == null ? null : Number(dados[i].serie2));

            }

            let linhas = [
                criarLinha(nomes[0], serie1, '#829bc2'),
                criarLinha(nomes[1], serie2, '#a78bfa')
            ];

            grafico.options.scales.y.max = max;
            grafico.options.scales.y.ticks.stepSize = passo;

            grafico.data.labels = rotulos;
            grafico.data.datasets = linhas;
            grafico.update();

            // Monta a legenda
            let legenda = '';

            for (let i = 0; i < linhas.length; i++) {
                legenda += '<span><i style="background:' + linhas[i].borderColor + '"></i>' + linhas[i].label + '</span>';
            }

            document.getElementById('legendaGrafico').innerHTML = legenda;

        })
        .catch(function (erro) {
            console.log('Erro ao buscar o histórico: ', erro);
        });

}


// Ação dos botões

let botoes = document.querySelectorAll('.periodos button');

for (let i = 0; i < botoes.length; i++) {

    botoes[i].addEventListener('click', function () {
        atualizarGrafico(botoes[i].getAttribute('data-p'));
    });

}




if (idUsuario == undefined) {

    window.location = '../login.html';

} else {

    buscarKPIs();
    atualizarGrafico('cpu');

    
    setInterval(buscarKPIs, 5000);

    setInterval(function () {
        atualizarGrafico(metricaAtual);
    }, 30000);

}

    </script>

</body>
</html>
