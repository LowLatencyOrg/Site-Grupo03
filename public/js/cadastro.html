<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar Conta — lowlatency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="assets/icon/LowLatency-logo.png" />
  <link rel="stylesheet" href="css/auth.css" />
</head>

<body>

  <div class="layout-auth">
    <!-- Lado Esquerdo: Imagem de Telemetria -->
    <div class="lado-imagem">
      <img src="assets/imgs/img-cad-log.jpg" alt="Telemetria Financeira" class="img-cad-log">
    </div>

    <!-- Lado Direito: Painel de Cadastro -->
    <div class="lado-formulario">
      <a href="landing.html" class="voltar-inicio">Voltar para o início</a>

      <!-- Cabeçalho -->
      <div class="cabecalho-auth">
        <h1 class="titulo-auth">Criar Conta na LowLatency</h1>
      </div>

      <!-- Formulário de Cadastro -->
      <form class="formulario-cadastro">

        <div class="grupo-campo">
          <label class="rotulo-campo">Nome completo *</label>
          <input class="campo-nome" id="nome_input" type="text" value="João da Silva"
            placeholder="Ex: Roberto Silva" required />
        </div>

        <div class="grupo-campo">
          <label class="rotulo-campo">Email corporativo *</label>
          <input class="campo-email" id="email_input" type="email" value="admin@lowlatency.com.br"
            placeholder="roberto@empresa.com.br" required />
        </div>

        <div class="grupo-campo">
          <label class="rotulo-campo">Empresa / Instituição *</label>
          <input class="campo-empresa" id="empresa_input" type="text" value="Instituição Financeira S/A"
            placeholder="Ex: Banco Alpha S/A" required />
        </div>

        <div class="grupo-campo">
          <label class="rotulo-campo">CNPJ *</label>
          <input class="campo-cnpj" id="cnpj_input" type="text" value="12.345.678/0001-90"
            placeholder="00.000.000/0000-00" required />
        </div>

        <div class="grupo-campo">
          <label class="rotulo-campo">Telefone *</label>
          <input class="campo-telefone" id="telefone_input" type="tel" value="(11) 98765-4321"
            placeholder="(00) 00000-0000" required />
        </div>

        <div class="grupo-campo">
          <label class="rotulo-campo">Senha de acesso *</label>
          <input class="campo-senha" id="senha_input" type="password" value="123456" placeholder="Mínimo 6 caracteres"
            required />
        </div>

        <div class="grupo-campo">
          <label class="rotulo-campo">Confirmar senha *</label>
          <input class="campo-confirmar-senha" id="confirmacao_senha_input" type="password" value="123456"
            placeholder="Repita a senha" required />
        </div>

        <button type="button" class="botao-cadastrar" onclick="cadastrar()">Concluir Cadastro</button>

      </form>

      <div class="rodape-auth">
        Já possui uma conta? <a href="login.html">Fazer login</a>
      </div>

      <div id="cardErro" class="mensagem-alerta">
        <p id="mensagem_erro"></p>
      </div>
    </div>
  </div>

  <script>
    function cadastrar() {
      var nomeVar = nome_input.value;
      var emailVar = email_input.value;
      var empresaVar = empresa_input.value;
      var cnpjVar = cnpj_input.value;
      var telefoneVar = telefone_input.value;
      var senhaVar = senha_input.value;
      var confirmacaoSenhaVar = confirmacao_senha_input.value;

      if (nomeVar == "" || emailVar == "" || empresaVar == "" || cnpjVar == "" || telefoneVar == "" || senhaVar == "" || confirmacaoSenhaVar == "") {
        cardErro.style.display = "block";
        cardErro.className = "mensagem-alerta erro";
        mensagem_erro.innerHTML = "Preencha todos os campos em branco para prosseguir!";
        setTimeout(sumirMensagem, 5000);
        return false;
      }

      if (senhaVar != confirmacaoSenhaVar) {
        cardErro.style.display = "block";
        cardErro.className = "mensagem-alerta erro";
        mensagem_erro.innerHTML = "As senhas digitadas não coincidem!";
        setTimeout(sumirMensagem, 5000);
        return false;
      }

      if (emailVar == "admin@lowlatency.com.br" && senhaVar == "123456" && cnpjVar == "12.345.678/0001-90") {
        cardErro.style.display = "block";
        cardErro.className = "mensagem-alerta";
        mensagem_erro.innerHTML = "Cadastro realizado com sucesso! Redirecionando...";
        setTimeout(sumirMensagem, 5000);
        setTimeout(trocaTela, 2500)
      } else {
        cardErro.style.display = "block";
        cardErro.className = "mensagem-alerta erro";
        mensagem_erro.innerHTML = "Utilize o e-mail e senha corporativos pré-setados!";
        setTimeout(sumirMensagem, 5000);
      }

      return false;
    }

    function trocaTela(){
      window.location = "manutencao.html"
    }
    function sumirMensagem() {
      cardErro.style.display = "none";
    }
  </script>

</body>

</html>
