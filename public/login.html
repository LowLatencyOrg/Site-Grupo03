<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — lowlatency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="assets/icon/LowLatency-logo.png" />
  <link rel="stylesheet" href="css/auth.css" />
</head>

<body>

  <div class="layout-auth">
    <!-- Lado Esquerdo: Imagem de Telemetria -->
    <div class="lado-imagem">
      <img src="assets/imgs/banner.jpg" alt="Telemetria Financeira" class="img-cad-log">
    </div>

    <!-- Lado Direito: Painel de Login -->
    <div class="lado-formulario">
      <a href="index.html" class="voltar-inicio">Voltar para o início</a>

      <!-- Cabeçalho -->
      <div class="cabecalho-auth">
        <h1 class="titulo-auth">Acesso ao Painel LowLatency</h1>
      </div>

      <!-- Formulário de Login -->
      <form class="formulario-login">

        <div class="grupo-campo">
          <label class="rotulo-campo">Email corporativo</label>
          <input class="campo-email" id="email_input" type="email" value="admin@lowlatency.com.br"
            placeholder="seu@empresa.com.br" required />
        </div>

        <div class="grupo-campo">
          <label class="rotulo-campo">Senha</label>
          <input class="campo-senha" id="senha_input" type="password" value="123456" placeholder="••••••••" required />
        </div>

        <button type="button" class="botao-entrar" onclick="entrar()">Entrar na Plataforma</button>

      </form>

      <div class="rodape-auth">
        Não possui uma conta? <a href="cadastro.html">Criar nova conta</a>
      </div>

      <div id="cardErro" class="mensagem-alerta">
        <p id="mensagem_erro"></p>
      </div>
    </div>
  </div>

  <script>
    function entrar() {
      var emailVar = email_input.value;
      var senhaVar = senha_input.value;

      if (emailVar == "" || senhaVar == "") {
        cardErro.style.display = "block";
        cardErro.className = "mensagem-alerta erro";
        mensagem_erro.innerHTML = "Preencha todos os campos em branco para prosseguir!";
        setTimeout(sumirMensagem, 5000);
        return false;
      }

      if (emailVar == "admin@lowlatency.com.br" && senhaVar == "123456") {
        cardErro.style.display = "block";
        cardErro.className = "mensagem-alerta";
        mensagem_erro.innerHTML = "Login realizado com sucesso! Redirecionando...";
        setTimeout(sumirMensagem, 5000);
        setTimeout(trocaTela, 2500)
      } else {
        cardErro.style.display = "block";
        cardErro.className = "mensagem-alerta erro";
        mensagem_erro.innerHTML = "E-mail e/ou senha inválido(s)!";
        setTimeout(sumirMensagem, 5000);
      }

      return false;
    }

    function trocaTela(){
      window.location = "dashboard/dashboard-principal.html"
    }
    function sumirMensagem() {
      cardErro.style.display = "none";
    }
  </script>

</body>

</html>
