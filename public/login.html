<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — lowlatency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="assets/icon/LowLatency-logo.png" />
  <link rel="stylesheet" href="css/auth.css" />
</head>

<body>

  <div class="layout-auth">
    <!-- Lado Esquerdo: Imagem de Telemetria -->
    <div class="lado-imagem">
      <img src="assets/imgs/banner.jpg" alt="Telemetria Financeira" class="img-cad-log">
    </div>

    <!-- Lado Direito: Painel de Login -->
    <div class="lado-formulario">
      <a href="index.html" class="voltar-inicio">Voltar para o início</a>

      <!-- Cabeçalho -->
      <div class="cabecalho-auth">
        <h1 class="titulo-auth">Acesso ao Painel LowLatency</h1>
      </div>

      <!-- Formulário de Login -->
      <form class="formulario-login" onsubmit="return entrar(event)">

        <div class="grupo-campo">
          <label class="rotulo-campo">Email corporativo</label>
          <input class="campo-email" id="email_input" type="email" placeholder="seu@empresa.com.br" required />
        </div>

        <div class="grupo-campo">
          <label class="rotulo-campo">Senha</label>
          <input class="campo-senha" id="senha_input" type="password" placeholder="••••••" required />
        </div>

        <button type="submit" class="botao-entrar">Entrar na Plataforma</button>

      </form>

      <div id="cardErro" class="mensagem-alerta" style="display: none;">
        <p id="mensagem_erro"></p>
      </div>
    </div>
  </div>

  <script>
    function entrar(event) {
        if (event) event.preventDefault();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block";
            cardErro.className = "mensagem-alerta erro";
            mensagem_erro.innerHTML = "Preencha todos os campos em branco para prosseguir!";
            setTimeout(sumirMensagem, 5000);
            return false;
        }

        fetch("http://localhost:3333/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!");

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));

                    sessionStorage.ID_USUARIO = json.id_usuario;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.FK_EMPRESA = json.fk_empresa;
                    sessionStorage.FK_CARGO = json.fk_cargo;

                    cardErro.style.display = "block";
                    cardErro.className = "mensagem-alerta";
                    mensagem_erro.innerHTML = "Login realizado com sucesso! Redirecionando...";

                    setTimeout(function () {
                        window.location.href = "dashboard/dashboard-principal.html";
                    }, 2000);
                });

            } else {
                console.log("Houve um erro ao tentar realizar o login!");
                
                resposta.text().then(texto => {
                    console.error(texto);
                    cardErro.style.display = "block";
                    cardErro.className = "mensagem-alerta erro";
                    mensagem_erro.innerHTML = "E-mail e/ou senha inválido(s)!";
                    setTimeout(sumirMensagem, 5000);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
            cardErro.style.display = "block";
            cardErro.className = "mensagem-alerta erro";
            mensagem_erro.innerHTML = "Falha ao conectar com o servidor. Tente novamente mais tarde.";
            setTimeout(sumirMensagem, 5000);
        });

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
    }
  </script>
</body>

</html>
